<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Announcements — VSAS | Visual Vertex Technology Company</title>
  <meta name="description" content="Company announcements for Visual Vertex Staff Attendance System." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .announcement-card {
      background-color: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      margin-bottom: var(--space-md);
      box-shadow: var(--shadow-sm);
    }
    .announcement-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: var(--space-sm);
      gap: var(--space-sm);
    }
    .announcement-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--black);
      margin: 0;
    }
    .announcement-meta {
      font-size: 0.8rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .announcement-content {
      font-size: 0.95rem;
      color: var(--dark-gray);
      line-height: 1.7;
    }
  </style>
</head>
<body class="dashboard-body">

  <!-- ===================== TOP NAVIGATION ===================== -->
  <header class="app-topbar">
    <div class="app-topbar-inner">
      <div class="app-topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
        </button>
        <a href="index.html" class="brand"><span class="brand-mark"><img src="images/logo.png" alt="Visual Vertex Technology Company Logo" class="company-logo"></span><span class="brand-name">Visual Vertex<span class="brand-name-sub">Technology Company</span></span></a>
      </div>
      <div class="app-topbar-right">
        <div class="notification-wrap">
          <button class="icon-btn" id="notificationBell" aria-label="View notifications" aria-expanded="false" aria-haspopup="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 9a6 6 0 1112 0c0 3.2 1 5 1.5 5.5H4.5C5 14 6 12.2 6 9z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9.5 17.5a2.5 2.5 0 005 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="notification-dot" id="notificationDot"></span></button>
          <div class="notification-panel" id="notificationPanel" role="menu">
             <p class="notification-panel-title">Notifications</p><div id="notificationList"><p style="font-size: 0.8rem; color: var(--muted); padding: 0.5rem;">Loading...</p></div>
          </div>
        </div>
        <button class="avatar-btn" id="profileMenuTrigger" aria-label="Open profile menu"><span class="avatar-circle" id="topAvatarCircle">--</span><span class="avatar-btn-name" id="topAvatarName">Loading…</span></button>
      </div>
    </div>
  </header>

  <div class="app-body">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand"><img src="images/logo.png" alt="Visual Vertex Technology Company Logo" class="company-logo"><span class="sidebar-brand-name">Visual Vertex<small>Technology Company</small></span></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>Dashboard</a>
        <a href="attendance.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9 12.5l2 2 4-4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.5"/></svg>Attendance</a>
        <a href="#" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 20V10M12 20V4M18 20v-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Attendance History</a>
        <a href="profile.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="12" cy="8.5" r="3.25" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 20c0-3.3 2.9-6 6.5-6s6.5 2.7 6.5 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>My Profile</a>
        <a href="announcements.html" class="sidebar-link is-active"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 6.5A1.5 1.5 0 015.5 5h13A1.5 1.5 0 0120 6.5V16a1.5 1.5 0 01-1.5 1.5h-9L6 20.5V17.5H5.5A1.5 1.5 0 014 16v-9.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Announcements</a>
        <a href="#" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M19 12a7 7 0 00-.15-1.45l1.9-1.48-1.9-3.29-2.24.9a7 7 0 00-2.52-1.46L13.7 3h-3.4l-.4 2.22a7 7 0 00-2.52 1.46l-2.24-.9-1.9 3.29 1.9 1.48A7 7 0 005 12c0 .5.05.98.15 1.45l-1.9 1.48 1.9 3.29 2.24-.9c.75.63 1.6 1.13 2.52 1.46l.4 2.22h3.4l.4-2.22a7 7 0 002.52-1.46l2.24.9 1.9-3.29-1.9-1.48c.1-.47.15-.95.15-1.45z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>Settings</a>
        <div class="sidebar-divider"></div>
        <a href="login.html" class="sidebar-link sidebar-link--logout" id="logoutLink"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9 4.5H6A1.5 1.5 0 004.5 6v12A1.5 1.5 0 006 19.5h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M14.5 8.5L18.5 12l-4 3.5M18.5 12H9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Logout</a>
      </nav>
    </aside>

    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="dashboard-main">
      <div class="dashboard-heading">
        <h1 class="dashboard-greeting">Company Announcements</h1>
        <p style="color: var(--muted);">Latest updates and news from Visual Vertex.</p>
      </div>

      <form id="announcementForm" class="toolbar" hidden>
        <input id="announcementTitle" class="toolbar-select" placeholder="Announcement title" required>
        <input id="announcementCategory" class="toolbar-select" placeholder="Category">
        <textarea id="announcementContent" class="toolbar-select" placeholder="Announcement content" required></textarea>
        <label><input id="announcementPublish" type="checkbox"> Publish now</label>
        <button class="btn-add-staff" type="submit">Save Announcement</button>
      </form>

      <div id="announcementsList">
        <!-- Announcements will be injected here by announcements.js -->
        <div class="announcement-card">
          <p style="text-align: center; color: var(--muted);">Loading announcements...</p>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/announcements.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
