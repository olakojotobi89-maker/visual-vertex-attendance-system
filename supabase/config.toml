# -----------------------------------------------------------------------
# supabase/config.toml
# Supabase project configuration for Vertex Staff Management System
#
# Generated for use with Supabase CLI v1+
# Reference: https://supabase.com/docs/reference/cli/config
# -----------------------------------------------------------------------

[project]
name = "vertex-staff-management"
# Replace with your actual Supabase project ID (from Dashboard > Settings > General)
ref = "your-project-ref"
# The port for the local development Studio UI
port = 54323

[auth]
enabled = true
# Customize these based on your security requirements
max_session_length = 3600  # 1 hour (in seconds)
sessions_timebox = false
# Site URL for auth redirects (update to your production domain)
site_url = "http://localhost:5500"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://127.0.0.1:5500",
]
jwt_expiry = 3600
enable_signup = false  # We create users via the Edge Function (admin only)
email_confirm_changes = true

[auth.email]
enabled = true
# Disable user signups via the standard flow — we only create users
# server-side via the create-staff Edge Function.
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
min_password_length = 8

[edge_runtime]
# Edge Functions runtime configuration
enabled = true
policy_area = "per_function"

[edge_runtime.deno]
# For local development, use the latest stable Deno version
# Supabase Edge Functions run on Deno, not Node.js
version = "1.46"

[functions]
enabled = true
# By default, functions are public (no auth required to invoke).
# Our create-staff function enforces auth internally, so this is fine.
verify_jwt = false

[functions."create-staff"]
enabled = true
# The function's entry point relative to supabase/functions/
entrypoint = "./create-staff/index.ts"
# Environment variables (secrets) are managed via `supabase secrets set`
# and are NOT stored in this config file.

[functions."manage-vsas"]
enabled = true
entrypoint = "./manage-vsas/index.ts"

[api]
enabled = true
port = 54321
# The API gateway for local development
# PostgREST
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Postgres connection settings
port = 54322
migration_dir = "./supabase/migrations"

[storage]
enabled = true
# Default file size limit (10 MB)
file_size_limit = "10MB"

[storage.buckets]
# The "avatars" bucket is created in the migration SQL
# Configuration here is a fallback default
default_public = false
allowed_mime_types = ["image/png", "image/jpeg", "image/jpg"]

# -----------------------------------------------------------------------
# IMPORTANT: Secrets are NOT stored in this file.
# Set them using the CLI:
#
#   supabase secrets set SUPABASE_URL=https://<ref>.supabase.co
#   supabase secrets set SUPABASE_ANON_KEY=<your-anon-key>
#   supabase secrets set SUPABASE_SERVICE_ROLE_KEY=<your-service-role-key>
#
# Or for local development, use:
#
#   supabase functions serve create-staff --env-file ./supabase/.env.local
# -----------------------------------------------------------------------

